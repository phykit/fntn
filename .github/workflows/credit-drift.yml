name: Credit drift pilot

# NON-EVIDENTIARY side test, not part of the FNTN funnel. See docs/CREDIT_DRIFT_2026-10-09.md.
# Runs when tools/credit_drift/DISPATCH changes on this branch, or by hand. DISPATCH holds one
# word naming the step. Nothing here touches EDGAR, so the runbook's concurrency group is not used.
on:
  push:
    branches: [credit-drift-2026-10-09]
    paths: [tools/credit_drift/DISPATCH]
  workflow_dispatch:
    inputs:
      step:
        description: "probe or run"
        required: true
        default: "probe"
        type: choice
        options: [probe, run]

concurrency:
  group: credit-drift
  cancel-in-progress: false

permissions:
  contents: read          # artifacts and logs only; nothing is committed back

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas pyarrow requests statsmodels openassetpricing
      - name: Resolve the step
        id: step
        run: |
          if [ -n "${{ inputs.step }}" ]; then s="${{ inputs.step }}"; else s="$(head -1 tools/credit_drift/DISPATCH | awk '{print $1}')"; fi
          echo "step=$s" >> "$GITHUB_OUTPUT"; echo "step: $s"
      - name: Cache downloaded public data
        uses: actions/cache@v4
        with:
          path: .cd_cache
          key: credit-drift-data-v1
      - name: Probe (structure only, no outcomes)
        if: ${{ steps.step.outputs.step == 'probe' }}
        run: |
          mkdir -p out .cd_cache
          python tools/credit_drift/probe.py --cache .cd_cache --out out 2>&1 | tee out/probe.log
      - name: Run the frozen test
        if: ${{ steps.step.outputs.step == 'run' }}
        run: |
          mkdir -p out .cd_cache
          sha256sum tools/credit_drift/PREREG.md | tee out/prereg.sha256
          python tools/credit_drift/run.py --cache .cd_cache --out out 2>&1 | tee out/run.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Credit drift pilot: \`${{ steps.step.outputs.step }}\` (non-evidentiary)"
            for f in out/*.log; do
              [ -e "$f" ] || continue
              echo "<details><summary>$(basename "$f")</summary>"; echo ""; echo '```'; tail -150 "$f"; echo '```'; echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credit-drift-${{ steps.step.outputs.step }}-${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
