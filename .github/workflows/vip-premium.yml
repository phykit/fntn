name: VIP premium side test

# NON-EVIDENTIARY side test, not part of the FNTN funnel. See docs/VIP_PREMIUM_2026-10-29.md.
#
# Runs when tools/degross_proxy_b/DISPATCH changes on this branch. DISPATCH holds one word naming
# the step (probe, all) and a counter. No other trigger.
#
# RETURN CHANNEL, as on degross-proxy (Version A): this workflow commits its own plain-text result
# files (logs and JSON, derived statistics only) to this branch under
# tools/degross_proxy_b/results/<run>/, and refuses anything above 3 MB.
#
# NOTHING IS CACHED AND NOTHING IS UPLOADED. Holdings, mappings and prices live on the runner's disk
# under data/ for the length of the job only, and data/ is never copied, printed or committed.
on:
  push:
    branches: [degross-proxy-2026-10-29]
    paths: [tools/vip_premium/DISPATCH]

concurrency:
  group: vip-premium
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BRANCH: degross-proxy-2026-10-29
      T: tools/vip_premium
      B: tools/degross_proxy_b
      SEC_CONTACT: ${{ secrets.SEC_CONTACT || 'Simon Kittson skittson@gmail.com' }}   # contact authorised by the operator, 29 Oct 2026
      EODHD_KEY: ${{ secrets.EODHD_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "numpy==2.2.6" "yfinance>=0.2.50"
      - name: Resolve the step
        id: step
        shell: bash
        run: |
          set -euo pipefail
          s="$(head -1 "$T/DISPATCH" | awk '{print $1}')"
          case "$s" in all) ;; *) echo "DISPATCH names no known step: '$s'"; exit 1 ;; esac
          echo "step=$s" >> "$GITHUB_OUTPUT"
          mkdir -p out
          if [ -z "${SEC_CONTACT:-}" ]; then echo "SEC_CONTACT secret: MISSING" | tee -a out/env.txt; else echo "SEC_CONTACT secret: set" | tee -a out/env.txt; fi
          if [ -z "${EODHD_KEY:-}" ]; then echo "EODHD_KEY secret: MISSING" | tee -a out/env.txt; else echo "EODHD_KEY secret: set" | tee -a out/env.txt; fi
      - name: Freeze record (this test and Version B's frozen builder)
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$T/PREREG.md" "$T/run.py" "$T/verify.py" "$T/selftest.py" "$T/compare.py" "$T/fetch_extra.py" | tee out/frozen_as_run.sha256.txt
          cat "$T/FROZEN.sha256" | tee -a out/frozen_as_run.sha256.txt
          for f in PREREG.md run.py verify.py; do
            want="$(grep " $T/$f\$" "$T/FROZEN.sha256" | awk '{print $1}')"
            have="$(sha256sum "$T/$f" | awk '{print $1}')"
            if [ "$want" != "$have" ]; then echo "::error::$f differs from the freeze record"; exit 1; fi
          done
          for f in build.py run.py fetch_raw.py fetch_prices.py; do
            want="$(grep " $B/$f\$" "$B/FROZEN.sha256" | awk '{print $1}')"
            have="$(sha256sum "$B/$f" | awk '{print $1}')"
            if [ "$want" != "$have" ]; then echo "::error::Version B $f differs from its freeze record"; exit 1; fi
          done
          echo "freeze records verified" | tee -a out/frozen_as_run.sha256.txt
      - name: Self-test on synthetic data
        shell: bash
        run: |
          set -euo pipefail
          python "$T/selftest.py" 2>&1 | tee out/selftest.log
      - name: Fetch inputs, build baskets, fetch prices (structure printed, never a value)
        shell: bash
        run: |
          set -euo pipefail
          python "$B/fetch_raw.py" --data data 2>&1 | grep -v -i -e "warning" -e "inplace" -e "^  " | tee out/fetch.log
          python "$B/build.py" --data data --out out 2>&1 | tail -3 | tee out/build.log
          python "$B/fetch_prices.py" --data data 2>&1 | grep -v -i -e "warning" -e "inplace" -e "^  " | tee out/prices.log
          python "$T/fetch_extra.py" --data data 2>&1 | grep -v -i -e "warning" -e "inplace" -e "^  " | tee out/fetch_extra.log
      - name: Run the frozen test
        shell: bash
        run: |
          set -euo pipefail
          python "$T/run.py" --data data --out out 2>&1 | tee out/run.log
      - name: Independent reimplementation and comparison
        shell: bash
        run: |
          set -euo pipefail
          python "$T/verify.py" --data data --out out 2>&1 | tee out/verify.log
          python "$T/compare.py" --out out 2>&1 | tee out/compare.log
      - name: Remove the inputs
        if: always()
        shell: bash
        run: rm -rf data
      - name: Commit the result files to this branch
        if: always()
        shell: bash
        env:
          STEP: ${{ steps.step.outputs.step }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          d="$T/results/${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then d="${d}_attempt${GITHUB_RUN_ATTEMPT}"; fi
          mkdir -p "$d" out
          {
            echo "step: ${STEP:-unresolved}"
            echo "job status at commit time: ${JOB_STATUS}"
            echo "commit: ${GITHUB_SHA}"
            echo "run id: ${GITHUB_RUN_ID}"
            echo "run number: ${GITHUB_RUN_NUMBER}"
            echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$d/meta.txt"
          shopt -s nullglob
          for f in out/*.log out/*.json out/*.txt; do
            n=$(stat -c %s "$f")
            if [ "$n" -gt 3000000 ]; then echo "refused (above 3 MB): $f" | tee -a "$d/meta.txt"; else cp "$f" "$d/"; fi
          done
          if [ -n "${EODHD_KEY:-}" ] && grep -rl -- "$EODHD_KEY" "$d" >/dev/null 2>&1; then
            echo "::error::a result file contains the EODHD key; nothing committed"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d"
          git commit -m "vip premium: results of ${STEP:-unresolved} run ${GITHUB_RUN_NUMBER} on ${GITHUB_SHA::7} (${JOB_STATUS})"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "the result files could not be pushed"; exit 1
