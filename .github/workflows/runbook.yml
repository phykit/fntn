name: Delisting runbook

# Manual only. Nothing here runs on push, because every job fetches from
# EDGAR and SEC fair-access terms are not something to trip on a commit.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        default: "split-pilot"
        type: choice
        options:
          - register          # step 1: rebuild the register over a span
          - split-pilot       # step 2a: 400-filing pilot of the paragraph split
          - split-census      # step 2b: the full paragraph split
          - mvm-smoke         # step 3a: 200-filing smoke test
          - mvm               # step 3b: the full minimum viable measurement
      start_date:
        description: "Register span start (register step only)"
        required: false
        default: "2010-01-01"
      end_date:
        description: "Register span end"
        required: false
        default: "2026-08-27"
      register_path:
        description: "Register the split/mvm steps read"
        required: false
        default: "archive/delistings/register.tsv"
      price_provider:
        description: "Price source for the mvm step"
        required: false
        default: "stooq"
        type: choice
        options: [stooq, eodhd]

# One at a time. Two concurrent runs would double the request rate at EDGAR.
concurrency:
  group: edgar-runbook
  cancel-in-progress: false

permissions:
  contents: read          # artifacts only; nothing is committed back

jobs:
  runbook:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # under the 360 hard limit, leaves room to upload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet numpy matplotlib

      - name: Check SEC is reachable and not rate-limiting this runner
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          set -euo pipefail
          if [ -z "${SEC_CONTACT:-}" ]; then
            echo "::error::SEC_CONTACT secret is not set. SEC fair access requires a contact string."
            exit 1
          fi
          code=$(curl -s -o /tmp/probe.idx -w "%{http_code}" \
            -H "User-Agent: $SEC_CONTACT" \
            "https://www.sec.gov/Archives/edgar/full-index/2024/QTR2/form.idx" \
            --max-time 120 || true)
          echo "probe HTTP $code, $(wc -c < /tmp/probe.idx) bytes"
          if [ "$code" != "200" ]; then
            echo "::error::EDGAR returned $code. SEC throttles or blocks some cloud IP ranges;"
            echo "::error::if this persists the job must be run from a residential connection."
            exit 1
          fi
          head -12 /tmp/probe.idx

      # 3 GB of quarterly indices. Cached so a re-run costs nothing.
      - name: Restore EDGAR index cache
        if: ${{ inputs.step == 'register' }}
        uses: actions/cache@v4
        with:
          path: .idx_cache
          key: edgar-idx-${{ inputs.start_date }}-${{ inputs.end_date }}
          restore-keys: edgar-idx-

      - name: Restore filing cache
        if: ${{ startsWith(inputs.step, 'split') || startsWith(inputs.step, 'mvm') }}
        uses: actions/cache@v4
        with:
          path: |
            .rule_cache
            .mvm_cache
          key: edgar-docs-${{ inputs.step }}-${{ github.run_id }}
          restore-keys: edgar-docs-

      - name: Step 1 — build the register
        if: ${{ inputs.step == 'register' }}
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          mkdir -p out
          python tools/build_register.py \
            --start "${{ inputs.start_date }}" \
            --end   "${{ inputs.end_date }}" \
            --out   "out/register_${{ inputs.start_date }}.tsv" \
            --cache .idx_cache | tee out/register.log

      - name: Step 2 — paragraph split
        if: ${{ startsWith(inputs.step, 'split') }}
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          DELISTING_REGISTER: ${{ inputs.register_path }}
        run: |
          mkdir -p out
          python tools/rule_split.py --out out --register "$DELISTING_REGISTER" \
            sample --n 12 | tee out/sample.log
          if [ "${{ inputs.step }}" = "split-pilot" ]; then
            python tools/rule_split.py --out out --register "$DELISTING_REGISTER" \
              run --limit 400 | tee out/split.log
          else
            python tools/rule_split.py --out out --register "$DELISTING_REGISTER" \
              run | tee out/split.log
          fi
          python tools/rule_split.py --out out report | tee out/report.log
          python tools/rule_split.py --out out draw --n 30

      - name: Step 3 — minimum viable measurement
        if: ${{ startsWith(inputs.step, 'mvm') }}
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
          DELISTING_REGISTER: ${{ inputs.register_path }}
        run: |
          mkdir -p out
          LIMIT=""
          if [ "${{ inputs.step }}" = "mvm-smoke" ]; then
            LIMIT="--limit-filings 200"
          fi
          python tools/mvm.py \
            --provider "${{ inputs.price_provider }}" \
            --register "${{ inputs.register_path }}" \
            $LIMIT --out out | tee out/mvm.log

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## Runbook — \`${{ inputs.step }}\`"
            echo ""
            for f in out/*.log; do
              [ -e "$f" ] || continue
              echo "<details><summary>$(basename "$f")</summary>"
              echo ""; echo '```'
              tail -60 "$f"
              echo '```'; echo "</details>"; echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runbook-${{ inputs.step }}-${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
