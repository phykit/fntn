name: Follow-up studies 1 to 4 side tests

# NON-EVIDENTIARY side tests, not part of the FNTN funnel. Pre-registrations under
# tools/degross_ext, tools/crowd_degross, tools/cross_pb and tools/clone_etfs.
#
# Runs when tools/crowd_degross/DISPATCH changes on this branch. DISPATCH holds one word naming the
# step (crowd_clone: studies 2 and 4; final: studies 1 and 3 and study 2's declared secondary) and a
# counter. No other trigger.
#
# RETURN CHANNEL as on the other side tests: derived statistics only are committed under
# tools/crowd_degross/results/<run>/; inputs live under data*/ for the job only and are never
# printed or committed.
on:
  push:
    branches: [degross-proxy-2026-10-29]
    paths: [tools/crowd_degross/DISPATCH]

concurrency:
  group: followup2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BRANCH: degross-proxy-2026-10-29
      A: tools/degross_proxy
      B: tools/degross_proxy_b
      E: tools/degross_episodes
      S2: tools/crowd_degross
      S4: tools/clone_etfs
      S1: tools/degross_ext
      S3: tools/cross_pb
      G: tools/gvip_live
      V: tools/vip_premium
      SEC_CONTACT: ${{ secrets.SEC_CONTACT || 'Simon Kittson skittson@gmail.com' }}   # contact authorised by the operator, 29 Oct 2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "numpy==2.2.6" "yfinance>=0.2.50"
      - name: Resolve the step
        id: step
        shell: bash
        run: |
          set -euo pipefail
          s="$(head -1 "$S2/DISPATCH" | awk '{print $1}')"
          case "$s" in crowd_clone|final) ;; *) echo "DISPATCH names no known step: '$s'"; exit 1 ;; esac
          echo "step=$s" >> "$GITHUB_OUTPUT"
          mkdir -p out
      - name: Freeze records
        shell: bash
        run: |
          set -euo pipefail
          check() { # dir file...
            local d="$1"; shift
            for f in "$@"; do
              want="$(grep " $d/$f\$" "$d/FROZEN.sha256" | awk '{print $1}')"; have="$(sha256sum "$d/$f" | awk '{print $1}')"
              if [ -z "$want" ] || [ "$want" != "$have" ]; then echo "::error::$d/$f differs from its freeze record"; exit 1; fi
              echo "verified $d/$f $have" | tee -a out/frozen_as_run.sha256.txt
            done
          }
          check "$A" PREREG.md run.py
          check "$B" PREREG.md build.py run.py fetch_raw.py fetch_prices.py
          check "$E" PREREG.md score.py episodes.csv
          check "$G" PREREG.md run.py
          check "$V" run.py fetch_extra.py
          check "$S2" PREREG.md run.py selftest.py
          check "$S4" PREREG.md run.py fetch.py selftest.py
          if [ "${{ steps.step.outputs.step }}" = "final" ]; then
            check "$S1" PREREG.md episodes_all.csv score_ext.py
            check "$S3" PREREG.md episodes_other.csv score_xpb.py
          fi
      - name: Self-tests
        shell: bash
        run: |
          set -euo pipefail
          python "$S2/selftest.py" 2>&1 | tee out/selftest_crowd.log
          python "$S4/selftest.py" 2>&1 | tee out/selftest_clone.log
      - name: Study 4, copycat ETFs
        if: steps.step.outputs.step == 'crowd_clone'
        shell: bash
        run: |
          set -euo pipefail
          python "$S4/fetch.py" --data data_c 2>&1 | grep -v -i -e "warning" -e "inplace" | tee out/clone_fetch.log
          mkdir -p out/clone
          python "$S4/run.py" --data data_c --out out/clone 2>&1 | tee out/clone_run.log
          cp out/clone/results.json out/results_clone.json
      - name: Fetch inputs for A, B and GVIP (structure printed, never a value)
        shell: bash
        run: |
          set -euo pipefail
          python "$A/fetch.py" --data data_a 2>&1 | tee out/fetch_a.log
          python "$B/fetch_raw.py" --data data_b 2>&1 | grep -v -i -e "warning" -e "inplace" -e "^  " | tee out/fetch_b.log
          python "$B/build.py" --data data_b --out out 2>&1 | tail -2 | tee out/build_b.log
          python "$B/fetch_prices.py" --data data_b 2>&1 | grep -v -i -e "warning" -e "inplace" -e "^  " | tee out/prices_b.log
          python "$G/fetch.py" --data data_g 2>&1 | grep -v -i -e "warning" -e "inplace" -e "^  " | tee out/fetch_g.log
      - name: Study 2, crowded longs in de-gross weeks (frozen 21 episodes)
        shell: bash
        run: |
          set -euo pipefail
          python "$S2/run.py" --bench data_g --data-b data_b --episodes "$E/episodes.csv" --out out --tag frozen21 2>&1 | tee out/crowd_frozen21.log
      - name: Studies 1 and 3, and study 2 on the combined list
        if: steps.step.outputs.step == 'final'
        shell: bash
        run: |
          set -euo pipefail
          python "$S2/run.py" --bench data_g --data-b data_b --episodes "$S1/episodes_all.csv" --out out --tag combined 2>&1 | tee out/crowd_combined.log
          python "$S1/score_ext.py" --data-a data_a --data-b data_b --out out 2>&1 | tee out/ext_score.log
          python "$S3/score_xpb.py" --data-a data_a --out out 2>&1 | tee out/xpb_score.log
      - name: Remove the inputs
        if: always()
        shell: bash
        run: rm -rf data data_a data_b data_c data_g
      - name: Commit the result files to this branch
        if: always()
        shell: bash
        env:
          STEP: ${{ steps.step.outputs.step }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          d="$S2/results/${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then d="${d}_attempt${GITHUB_RUN_ATTEMPT}"; fi
          mkdir -p "$d" out
          {
            echo "step: ${STEP:-unresolved}"
            echo "job status at commit time: ${JOB_STATUS}"
            echo "commit: ${GITHUB_SHA}"
            echo "run id: ${GITHUB_RUN_ID}"
            echo "run number: ${GITHUB_RUN_NUMBER}"
            echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$d/meta.txt"
          shopt -s nullglob
          for f in out/*.log out/*.json out/*.txt; do
            n=$(stat -c %s "$f")
            if [ "$n" -gt 3000000 ]; then echo "refused (above 3 MB): $f" | tee -a "$d/meta.txt"; else cp "$f" "$d/"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d"
          git commit -m "follow-up studies: results of ${STEP:-unresolved} run ${GITHUB_RUN_NUMBER} on ${GITHUB_SHA::7} (${JOB_STATUS})"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "the result files could not be pushed"; exit 1
