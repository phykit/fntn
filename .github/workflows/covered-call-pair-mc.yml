name: Covered-call pair Monte Carlo (theory check)

# NON-EVIDENTIARY side test, not part of the FNTN funnel. See docs/COVERED_CALL_PAIR_MC_2026-10-30.md.
#
# Runs when tools/covered_call_pair_mc/DISPATCH changes on this branch. DISPATCH holds one word
# naming the step (all) and a counter. No other trigger. No external data: the simulation draws
# its own numbers from the registered seed, so the runner needs nothing but numpy.
#
# RETURN CHANNEL: this workflow commits its own plain-text result files (logs and JSON, derived
# statistics only) to this branch under tools/covered_call_pair_mc/results/<run>/, and refuses
# anything above 3 MB.
on:
  push:
    branches: [covered-call-pair-mc-2026-10-30]
    paths: [tools/covered_call_pair_mc/DISPATCH]

concurrency:
  group: covered-call-pair-mc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: covered-call-pair-mc-2026-10-30
      T: tools/covered_call_pair_mc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "numpy==2.2.6"
      - name: Resolve the step
        id: step
        shell: bash
        run: |
          set -euo pipefail
          s="$(head -1 "$T/DISPATCH" | awk '{print $1}')"
          case "$s" in all) ;; *) echo "DISPATCH names no known step: '$s'"; exit 1 ;; esac
          echo "step=$s" >> "$GITHUB_OUTPUT"
          mkdir -p out
          python -c "import numpy, sys; print('numpy', numpy.__version__); print(sys.version)" | tee out/env.txt
      - name: Freeze record
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$T/PREREG.md" "$T/run.py" "$T/verify.py" "$T/selftest.py" "$T/compare.py" | tee out/frozen_as_run.sha256.txt
          cat "$T/FROZEN.sha256" | tee -a out/frozen_as_run.sha256.txt
          for f in PREREG.md run.py verify.py selftest.py compare.py; do
            want="$(grep " $T/$f\$" "$T/FROZEN.sha256" | awk '{print $1}')"
            have="$(sha256sum "$T/$f" | awk '{print $1}')"
            if [ "$want" != "$have" ]; then echo "::error::$f differs from the freeze record"; exit 1; fi
          done
          echo "freeze record verified" | tee -a out/frozen_as_run.sha256.txt
      - name: Self-test
        shell: bash
        run: |
          set -euo pipefail
          python "$T/selftest.py" 2>&1 | tee out/selftest.log
      - name: Run the frozen simulation
        shell: bash
        run: |
          set -euo pipefail
          python "$T/run.py" --out out 2>&1 | tee out/run.log
      - name: Independent reimplementation and comparison
        shell: bash
        run: |
          set -euo pipefail
          python "$T/verify.py" --out out 2>&1 | tee out/verify.log
          python "$T/compare.py" --out out 2>&1 | tee out/compare.log
      - name: Commit the result files to this branch
        if: always()
        shell: bash
        env:
          STEP: ${{ steps.step.outputs.step }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          d="$T/results/${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then d="${d}_attempt${GITHUB_RUN_ATTEMPT}"; fi
          mkdir -p "$d" out
          {
            echo "step: ${STEP:-unresolved}"
            echo "job status at commit time: ${JOB_STATUS}"
            echo "commit: ${GITHUB_SHA}"
            echo "run id: ${GITHUB_RUN_ID}"
            echo "run number: ${GITHUB_RUN_NUMBER}"
            echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$d/meta.txt"
          shopt -s nullglob
          for f in out/*.log out/*.json out/*.txt; do
            n=$(stat -c %s "$f")
            if [ "$n" -gt 3000000 ]; then echo "refused (above 3 MB): $f" | tee -a "$d/meta.txt"; else cp "$f" "$d/"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d"
          git commit -m "covered-call pair MC: results of ${STEP:-unresolved} run ${GITHUB_RUN_NUMBER} on ${GITHUB_SHA::7} (${JOB_STATUS})"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "the result files could not be pushed"; exit 1
