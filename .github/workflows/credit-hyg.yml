name: Credit HYG-IEF vs Nasdaq 100 side test

# NON-EVIDENTIARY side test outside the FNTN funnel. PREREG: tools/credit_hyg/PREREG.md.
# Runs when tools/credit_hyg/DISPATCH changes on this branch. Derived statistics only are committed
# under tools/credit_hyg/results/<run>/; prices live under data/ for the job only.
on:
  push:
    branches: [degross-proxy-2026-10-29]
    paths: [tools/credit_hyg/DISPATCH]

concurrency:
  group: credit-hyg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: degross-proxy-2026-10-29
      T: tools/credit_hyg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --quiet "numpy==2.2.6" "yfinance>=0.2.50"
      - name: Freeze record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for f in PREREG.md run.py selftest.py fetch.py verify.py compare.py; do
            want="$(grep " $T/$f\$" "$T/FROZEN.sha256" | awk '{print $1}')"; have="$(sha256sum "$T/$f" | awk '{print $1}')"
            if [ -z "$want" ] || [ "$want" != "$have" ]; then echo "::error::$f differs from the freeze record"; exit 1; fi
            echo "verified $T/$f $have" | tee -a out/frozen_as_run.sha256.txt
          done
      - name: Self-test
        shell: bash
        run: |
          set -euo pipefail
          python "$T/selftest.py" 2>&1 | tee out/selftest.log
      - name: Fetch (structure printed, never a value)
        shell: bash
        run: |
          set -euo pipefail
          python "$T/fetch.py" --data data 2>&1 | grep -v -i -e "warning" -e "inplace" | tee out/fetch.log
      - name: Run the frozen test, the independent implementation and the comparison
        shell: bash
        run: |
          set -euo pipefail
          python "$T/run.py" --data data --out out 2>&1 | tee out/run.log
          mkdir -p out/v
          python "$T/verify.py" --data data --out out/v 2>&1 | tee out/verify.log
          cp out/v/verify.json out/verify.json
          python "$T/compare.py" --a out/results.json --b out/verify.json 2>&1 | tee out/compare.log
      - name: Remove the inputs
        if: always()
        run: rm -rf data
      - name: Commit the result files to this branch
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          d="$T/results/${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then d="${d}_attempt${GITHUB_RUN_ATTEMPT}"; fi
          mkdir -p "$d" out
          { echo "job status at commit time: ${JOB_STATUS}"; echo "commit: ${GITHUB_SHA}"; echo "run id: ${GITHUB_RUN_ID}"; echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; } > "$d/meta.txt"
          shopt -s nullglob
          for f in out/*.log out/*.json out/*.txt; do cp "$f" "$d/"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d"
          git commit -m "credit hyg: results of run ${GITHUB_RUN_NUMBER} on ${GITHUB_SHA::7} (${JOB_STATUS})"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
